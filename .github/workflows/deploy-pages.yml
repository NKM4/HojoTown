name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify content and build
        run: |
          node scripts/check-articles.cjs
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler@3.114.14 pages deploy dist --project-name=hojotown --branch=master

      - name: Verify production URL fixes
        run: |
          for attempt in 1 2 3 4 5 6; do
            aizuwakamatsu=$(curl --fail --silent --show-error --max-time 20 \
              https://hojotown.jp/fukushima/aizuwakamatsu/kosodate-hojokin/) || true
            hyuga=$(curl --fail --silent --show-error --max-time 20 \
              https://hojotown.jp/miyazaki/hyuga/kosodate-hojokin/) || true
            if printf '%s' "$aizuwakamatsu" | grep -q '2025031100015' && \
               printf '%s' "$hyuga" | grep -q 'cont=241217104020' && \
               ! printf '%s' "$hyuga" | grep -q 'clist=0489'; then
              echo "Production contains the repaired official URLs."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not contain the repaired official URL after deployment."
          exit 1
